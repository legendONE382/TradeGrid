<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeGrid</title>
<style>body{font-family:Arial;max-width:900px;margin:auto;padding:12px}nav button{margin:4px}.tab{display:none}.tab.active{display:block}.card{border:1px solid #ddd;border-radius:8px;padding:8px;margin:8px 0}input,button,select,textarea{width:100%;padding:8px;margin:4px 0}</style></head>
<body><h1>TradeGrid Main App</h1><nav>
<button onclick="tab('market')">Market</button><button onclick="tab('orders')">Orders</button><button onclick="tab('ledger')">Debts</button><button onclick="tab('delivery')">Delivery</button><button onclick="tab('messages')">Messages</button><button onclick="tab('prices')">Prices</button></nav>
<section id="market" class="tab active"><h3>Post Listing</h3><input id="sellerId" placeholder="Seller ID"><input id="title" placeholder="Product"><input id="category" placeholder="Category"><input id="quantity" type="number" placeholder="Qty"><input id="unit" placeholder="Unit"><input id="price" type="number" placeholder="Price"><input id="town" placeholder="Town"><button onclick="saveListing()">Save Listing</button><small id="saveState"></small><h3>Nearby products</h3><input id="searchTown" placeholder="Town"><button onclick="loadListings()">Load</button><div id="listings"></div></section>
<section id="orders" class="tab"><h3>Request Order</h3><input id="orderListing" placeholder="Listing ID"><input id="buyerId" placeholder="Buyer ID"><input id="orderQty" type="number" placeholder="Qty"><select id="fulfillment"><option>pickup</option><option>delivery</option></select><textarea id="orderNote" placeholder="Note"></textarea><button onclick="requestOrder()">Request</button><div id="orderState"></div></section>
<section id="ledger" class="tab"><h3>Create Debt Entry</h3><input id="ledgerOrder" placeholder="Order ID"><input id="ledgerSeller" placeholder="Seller ID"><input id="ledgerBuyer" placeholder="Buyer ID"><input id="ledgerTotal" type="number" placeholder="Total"><input id="ledgerPaid" type="number" placeholder="Paid"><input id="ledgerDue" type="date"><button onclick="createLedger()">Save Debt</button><div id="ledgerState"></div></section>
<section id="delivery" class="tab"><h3>Open Delivery Job</h3><input id="dOrder" placeholder="Order ID"><input id="dFee" type="number" placeholder="Fee"><button onclick="openDelivery()">Create Job</button><h3>Open Jobs</h3><button onclick="loadOpenDeliveries()">Refresh</button><div id="deliveryJobs"></div></section>
<section id="messages" class="tab"><h3>Message</h3><input id="mFrom" placeholder="From user ID"><input id="mTo" placeholder="To user ID"><textarea id="mBody" placeholder="Message"></textarea><button onclick="sendMessage()">Send</button></section>
<section id="prices" class="tab"><h3>Price Board</h3><input id="pCommodity" placeholder="Commodity"><input id="pUnit" placeholder="Unit"><input id="pMin" type="number" placeholder="Min Price"><input id="pMax" type="number" placeholder="Max Price"><input id="pTown" placeholder="Town"><button onclick="addPrice()">Add</button><button onclick="loadPrices()">Load Prices</button><div id="pricesList"></div></section>
<script src="/app.js"></script></body></html>
