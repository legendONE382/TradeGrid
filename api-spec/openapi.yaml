openapi: 3.0.3
info:
  title: TradeGrid API
  version: 0.1.0
paths:
  /auth/register:
    post:
      summary: Register user
  /listings:
    get:
      summary: List nearby products
    post:
      summary: Create product listing
  /orders:
    post:
      summary: Request order
  /ledger/entries:
    get:
      summary: List ledger entries
    post:
      summary: Create ledger entry
  /admin/listings/{id}/moderate:
    post:
      summary: Approve or reject listing
  /sync/push:
    post:
      summary: Push offline mutations
  /sync/pull:
    get:
      summary: Pull incremental updates
